<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img" aria-labelledby="title desc" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">OCI Advanced Networking core topology and optional extensions</title>
  <desc id="desc">Lab 1 connects Hub and Spoke-1 in Ashburn to Remote-Spoke in Phoenix through DRGs and an RPC. Lab 2 uses Bastion in Spoke-1. Lab 3 analyzes the local path and tests live cross-region traffic. Optional labs cover cross-tenancy LPG peering, Azure connectivity, and a separate Firewall workshop.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 Z" fill="#216c86"/></marker>
  </defs>
  <rect width="1180" height="740" fill="#fff"/>
  <text x="30" y="40" font-size="26" font-weight="700" fill="#172b3a">OCI Advanced Networking</text>
  <text x="30" y="66" font-size="15" fill="#52616b">Core journey: build the network → access private hosts → diagnose and verify traffic</text>
  <rect x="30" y="94" width="700" height="363" rx="12" fill="#f3f7fa" stroke="#cad7df"/>
  <text x="50" y="126" font-size="18" font-weight="700" fill="#172b3a">Region A · US East (Ashburn)</text>
  <rect x="770" y="94" width="380" height="363" rx="12" fill="#f3f7fa" stroke="#cad7df"/>
  <text x="790" y="126" font-size="18" font-weight="700" fill="#172b3a">Region B · US West (Phoenix)</text>

  <rect x="50" y="151" width="300" height="182" rx="9" fill="#fff" stroke="#8fa6b3"/>
  <text x="68" y="178" font-size="16" font-weight="700" fill="#172b3a">Hub VCN</text>
  <text x="68" y="201" font-size="14" fill="#52616b">10.0.0.0/16 · shared services</text>
  <rect x="68" y="219" width="264" height="82" rx="6" fill="#e9f3f7"/>
  <text x="84" y="244" font-size="14" fill="#172b3a">Private subnet · 10.0.1.0/24</text>
  <text x="84" y="268" font-size="14" font-weight="600" fill="#172b3a">advnet-hub-vm</text>
  <text x="84" y="289" font-size="13" fill="#52616b">Diagnostic web app · TCP 8080</text>

  <rect x="390" y="151" width="320" height="182" rx="9" fill="#fff" stroke="#8fa6b3"/>
  <text x="408" y="178" font-size="16" font-weight="700" fill="#172b3a">Spoke-1 VCN</text>
  <text x="408" y="201" font-size="14" fill="#52616b">10.1.0.0/16 · local application</text>
  <rect x="408" y="218" width="284" height="32" rx="6" fill="#e6f4ec" stroke="#9bccae"/>
  <text x="550" y="239" text-anchor="middle" font-size="14" fill="#245940">OCI Bastion · Lab 2</text>
  <text x="408" y="275" font-size="14" font-weight="600" fill="#172b3a">advnet-spoke1-vm · TCP 8080</text>
  <text x="408" y="299" font-size="14" fill="#52616b">Private subnet · 10.1.0.0/24</text>
  <text x="408" y="319" font-size="12" fill="#52616b">SSH + local browser tunnel</text>

  <rect x="790" y="151" width="340" height="182" rx="9" fill="#fff" stroke="#8fa6b3"/>
  <text x="808" y="178" font-size="16" font-weight="700" fill="#172b3a">Remote-Spoke VCN</text>
  <text x="808" y="201" font-size="14" fill="#52616b">10.2.0.0/16 · remote application</text>
  <rect x="808" y="219" width="304" height="82" rx="6" fill="#e9f3f7"/>
  <text x="824" y="244" font-size="14" fill="#172b3a">Private subnet · 10.2.0.0/24</text>
  <text x="824" y="268" font-size="14" font-weight="600" fill="#172b3a">advnet-remotespoke-vm</text>
  <text x="824" y="289" font-size="13" fill="#52616b">Diagnostic web app · TCP 8080</text>

  <path d="M200 333 L200 385 L350 385" fill="none" stroke="#216c86" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M550 333 L550 385 L505 385" fill="none" stroke="#216c86" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="350" y="350" width="155" height="70" rx="9" fill="#216c86"/>
  <text x="427" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Ashburn DRG</text>
  <text x="427" y="401" text-anchor="middle" font-size="12" fill="#e0f0f5">advnet-drg-iad</text>
  <line x1="960" y1="333" x2="960" y2="350" stroke="#216c86" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="880" y="350" width="160" height="70" rx="9" fill="#216c86"/>
  <text x="960" y="378" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Phoenix DRG</text>
  <text x="960" y="401" text-anchor="middle" font-size="12" fill="#e0f0f5">advnet-drg-phx</text>
  <line x1="505" y1="385" x2="880" y2="385" stroke="#216c86" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="612" y="365" width="168" height="40" rx="7" fill="#fff" stroke="#b9cbd4"/>
  <text x="696" y="389" text-anchor="middle" font-size="14" font-weight="600" fill="#172b3a">RPC · private peering</text>
  <text x="50" y="441" font-size="13" fill="#52616b">Lab 3: same-region NPA + live HTTP tests and flow logs</text>
  <text x="790" y="441" font-size="13" fill="#52616b">Cross-region proof: RPC, routes, live HTTP</text>

  <text x="30" y="496" font-size="18" font-weight="700" fill="#172b3a">Optional customer extensions</text>
  <rect x="30" y="516" width="353" height="152" rx="10" fill="#f8fafb" stroke="#b9cbd4" stroke-dasharray="5 4"/>
  <text x="48" y="545" font-size="16" font-weight="700" fill="#172b3a">4 · Cross-tenancy LPG challenge</text>
  <text x="48" y="574" font-size="14" fill="#52616b">Same-region shared services ↔ customer</text>
  <text x="48" y="598" font-size="14" fill="#52616b">Bilateral IAM + explicit routes/security</text>
  <text x="48" y="640" font-size="13" fill="#52616b">Private service access; inspection needs design</text>
  <rect x="413" y="516" width="353" height="152" rx="10" fill="#f8fafb" stroke="#b9cbd4" stroke-dasharray="5 4"/>
  <text x="431" y="545" font-size="16" font-weight="700" fill="#172b3a">5 · OCI ↔ Azure connectivity</text>
  <text x="431" y="574" font-size="14" fill="#52616b">Azure VNet · 10.10.0.0/16</text>
  <text x="431" y="598" font-size="14" fill="#52616b">FastConnect/ExpressRoute or IPSec VPN</text>
  <text x="431" y="640" font-size="13" fill="#52616b">Hands-on extension or design discussion</text>
  <rect x="796" y="516" width="354" height="152" rx="10" fill="#f8fafb" stroke="#b9cbd4" stroke-dasharray="5 4"/>
  <text x="814" y="545" font-size="16" font-weight="700" fill="#172b3a">6 · Network Firewall use cases</text>
  <text x="814" y="574" font-size="14" fill="#52616b">East-west + inbound/outbound inspection</text>
  <text x="814" y="598" font-size="14" fill="#52616b">TLS decryption + intrusion detection</text>
  <text x="814" y="640" font-size="13" fill="#52616b">Separate linked LiveLabs · 3–5 hours</text>
  <text x="30" y="706" font-size="13" fill="#52616b">All core hosts use private IPs. Public wizard subnets and outbound gateways are omitted from this overview.</text>
</svg>
